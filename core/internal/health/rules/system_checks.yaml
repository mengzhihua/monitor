# External passive checks (Nagios/Zabbix trapper/Datadog service check).
# status: 0 ok, 1 warning, 2 critical, 3 expired.
alarms:
  - name: external_check_status
    on: check.status
    class: Errors
    type: External
    component: Check
    lookup: max -1m unaligned absolute of status
    units: status
    every: 10s
    warn: '$this == 1'
    crit: '$this >= 2'
    delay: down 1m multiplier 1 max 5m
    info: An external service check is warning, critical, or expired
    to: sysadmin
