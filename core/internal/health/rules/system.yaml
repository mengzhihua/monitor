# Built-in health rules for the system collectors. Override or extend with
# files in health.d/ (see health.dir in monitor.yaml); a rule with the same
# name in health.d replaces the built-in one.
alarms:
  - name: 10min_cpu_usage
    on: system.cpu
    class: Utilization
    type: System
    component: CPU
    lookup: average -10m unaligned of user,system,nice,irq,softirq,steal
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (75) : (85))'
    crit: '$this > (($status == $CRITICAL) ? (85) : (95))'
    delay: down 15m multiplier 1.5 max 1h
    info: average CPU utilization over the last 10 minutes (excluding iowait, idle and guest)
    to: sysadmin

  - name: 10min_cpu_iowait
    on: system.cpu
    class: Utilization
    type: System
    component: CPU
    lookup: average -10m unaligned of iowait
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (20) : (40))'
    delay: up 30m down 30m multiplier 1.5 max 2h
    info: average CPU iowait time over the last 10 minutes
    to: sysadmin

  - name: load_average_15
    on: system.load
    class: Utilization
    type: System
    component: Load
    lookup: average -1m unaligned of load15
    calc: '$this / $cpus'
    units: load
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (1.75) : (2))'
    crit: '$this > (($status == $CRITICAL) ? (3.5) : (4))'
    delay: down 15m multiplier 1.5 max 1h
    info: 15-minute system load average per CPU core
    to: sysadmin

  - name: load_average_5
    on: system.load
    class: Utilization
    type: System
    component: Load
    lookup: average -1m unaligned of load5
    calc: '$this / $cpus'
    units: load
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (3.5) : (4))'
    crit: '$this > (($status == $CRITICAL) ? (7) : (8))'
    delay: down 15m multiplier 1.5 max 1h
    info: 5-minute system load average per CPU core
    to: sysadmin

  - name: ram_in_use
    on: system.ram
    class: Utilization
    type: System
    component: Memory
    lookup: average -1m unaligned percentage of used
    units: '%'
    every: 10s
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: down 15m multiplier 1.5 max 1h
    info: system memory utilization
    to: sysadmin

  - name: ram_available
    on: mem.available
    class: Utilization
    type: System
    component: Memory
    lookup: average -1m unaligned of avail
    calc: '$this * 100 / $ram_total'
    units: '%'
    every: 10s
    warn: '$this < (($status >= $WARNING) ? (15) : (10))'
    crit: '$this < (($status == $CRITICAL) ? (10) : (5))'
    delay: down 15m multiplier 1.5 max 1h
    info: percentage of estimated amount of RAM available for userspace processes, without causing swapping
    to: sysadmin

  - name: used_swap
    on: mem.swap
    class: Utilization
    type: System
    component: Memory
    lookup: average -10m unaligned percentage of used
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: up 30s down 15m multiplier 1.5 max 1h
    info: swap memory utilization
    to: sysadmin

  - name: 30min_ram_swapped_out
    on: mem.swapio
    class: Workload
    type: System
    component: Memory
    lookup: sum -30m unaligned absolute of out
    calc: '$this / 1024 * 100 / $ram_total'
    units: '% of RAM'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (10) : (20))'
    delay: up 0 down 15m multiplier 1.5 max 1h
    info: percentage of the system RAM swapped out in the last 30 minutes
    to: sysadmin

  - name: disk_space_usage
    on: disk.space
    class: Utilization
    type: System
    component: Disk
    lookup: average -1m unaligned percentage of used
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: up 1m down 15m multiplier 1.5 max 1h
    info: disk space utilization
    to: sysadmin

  - name: disk_inode_usage
    on: disk.inodes
    class: Utilization
    type: System
    component: Disk
    lookup: average -1m unaligned percentage of used
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: up 1m down 15m multiplier 1.5 max 1h
    info: disk inode utilization
    to: sysadmin

  - name: 10min_disk_utilization
    on: disk.util
    class: Utilization
    type: System
    component: Disk
    lookup: average -10m unaligned of utilization
    units: '%'
    every: 1m
    warn: '$this > 98'
    delay: down 15m multiplier 1.2 max 1h
    info: average percentage of time the disk was busy over the last 10 minutes
    to: silent

  - name: 1m_received_packets_rate
    on: net.packets
    class: Workload
    type: System
    component: Network
    lookup: average -1m unaligned of received
    units: packets/s
    every: 10s
    info: average number of packets received per second over the last minute
    to: silent

  - name: 10s_received_packets_storm
    on: net.packets
    class: Workload
    type: System
    component: Network
    lookup: average -10s unaligned of received
    calc: '$this * 100 / (($1m_received_packets_rate < 1000) ? (1000) : ($1m_received_packets_rate))'
    units: '%'
    every: 10s
    warn: '$this > (($status >= $WARNING) ? (200) : (5000))'
    crit: '$this > (($status == $CRITICAL) ? (5000) : (6000))'
    delay: down 1m multiplier 1.5 max 1h
    info: ratio of average number of received packets in the last 10 seconds, compared to the rate over the last minute
    to: sysadmin

  - name: 10min_interface_inbound_errors
    on: net.errors
    class: Errors
    type: System
    component: Network
    lookup: sum -10m unaligned absolute of inbound
    units: errors
    every: 1m
    warn: '$this >= 5'
    delay: down 1h multiplier 1.5 max 2h
    info: number of inbound errors for the network interface in the last 10 minutes
    to: sysadmin

  - name: 10min_interface_outbound_errors
    on: net.errors
    class: Errors
    type: System
    component: Network
    lookup: sum -10m unaligned absolute of outbound
    units: errors
    every: 1m
    warn: '$this >= 5'
    delay: down 1h multiplier 1.5 max 2h
    info: number of outbound errors for the network interface in the last 10 minutes
    to: sysadmin

  - name: 10min_interface_inbound_drops
    on: net.drops
    class: Errors
    type: System
    component: Network
    lookup: sum -10m unaligned absolute of inbound
    units: drops
    every: 1m
    warn: '$this >= 10'
    delay: down 1h multiplier 1.5 max 2h
    info: number of inbound dropped packets for the network interface in the last 10 minutes
    to: sysadmin

  - name: lowest_entropy
    on: system.entropy
    class: Latency
    type: System
    component: Entropy
    lookup: min -5m unaligned of entropy
    units: entropy
    every: 1m
    warn: '$this < (($status >= $WARNING) ? (200) : (100))'
    delay: down 5m multiplier 1.5 max 1h
    info: minimum number of bits of entropy available for the kernel random number generator
    to: sysadmin

  - name: 1m_memory_some_pressure
    on: system.memory_some_pressure
    class: Utilization
    type: System
    component: Pressure
    lookup: average -1m unaligned of avg10
    units: '%'
    every: 10s
    warn: '$this > (($status >= $WARNING) ? (10) : (20))'
    crit: '$this > (($status == $CRITICAL) ? (20) : (50))'
    delay: down 5m multiplier 1.5 max 1h
    info: memory some-pressure stall average over 10 seconds
    to: sysadmin

  - name: httpcheck_failed
    on: httpcheck.status
    class: Availability
    type: Service
    component: HTTP
    lookup: average -1m unaligned of failure
    units: 'failed'
    every: 10s
    warn: '$this > 0.5'
    delay: down 2m multiplier 1.5 max 30m
    info: HTTP check is failing
    to: sysadmin

  - name: 10min_tcp_retransmits
    on: ipv4.tcperrors
    class: Errors
    type: System
    component: TCP
    lookup: sum -10m unaligned absolute of RetransSegs
    units: packets
    every: 1m
    warn: '$this > 100'
    delay: down 15m multiplier 1.5 max 1h
    info: TCP segments retransmitted in the last 10 minutes
    to: sysadmin

  - name: mysql_threads_connected
    on: mysql.threads
    class: Utilization
    type: Database
    component: MySQL
    lookup: average -1m unaligned of connected
    units: threads
    every: 10s
    warn: '$this > 80'
    delay: down 5m multiplier 1.5 max 1h
    info: MySQL currently connected threads
    to: sysadmin

  - name: elasticsearch_cluster_red
    on: elasticsearch.cluster_health_status
    class: Availability
    type: Database
    component: Elasticsearch
    lookup: last -10s unaligned of red
    units: 'status'
    every: 10s
    crit: '$this > 0.5'
    delay: down 2m multiplier 1.5 max 30m
    info: Elasticsearch cluster status is red
    to: sysadmin

  - name: ssl_cert_expiration
    on: sslcheck.time_until_expiration
    class: Latency
    type: Service
    component: TLS
    lookup: min -1m unaligned of days
    units: days
    every: 1m
    warn: '$this < (($status >= $WARNING) ? (30) : (14))'
    crit: '$this < (($status == $CRITICAL) ? (7) : (2))'
    delay: down 1h multiplier 1.5 max 1d
    info: TLS certificate days until expiration
    to: sysadmin

  - name: dnsquery_failed
    on: dns_query.query_status
    class: Availability
    type: Service
    component: DNS
    lookup: average -1m unaligned of failure
    units: 'failed'
    every: 10s
    warn: '$this > 0.5'
    delay: down 2m multiplier 1.5 max 30m
    info: DNS query is failing
    to: sysadmin

  - name: conntrack_full
    on: netfilter.conntrack_sockets
    class: Utilization
    type: System
    component: Netfilter
    lookup: average -10s unaligned of connections
    calc: '$this * 100 / (($max < 1) ? (1) : ($max))'
    units: '%'
    every: 10s
    warn: '$this > (($status >= $WARNING) ? (75) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: down 5m multiplier 1.5 max 1h
    info: netfilter connection tracking table utilization
    to: sysadmin

  - name: md_degraded
