    type: System
    component: RAID
    lookup: last -10s unaligned of down
    units: disks
    every: 10s
    warn: '$this > 0'
    delay: down 5m multiplier 1.5 max 1h
    info: MD RAID array has failed disks
    to: sysadmin

  - name: haproxy_backend_down
    on: haproxy.backend_status
    class: Availability
    type: Service
    component: HAProxy
    lookup: last -10s unaligned of down
    units: backends
    every: 10s
    warn: '$this > 0'
    delay: down 2m multiplier 1.5 max 30m
    info: HAProxy backends are down
    to: sysadmin

  - name: consul_checks_critical
    on: consul.health_checks
    class: Availability
    type: Service
    component: Consul
    lookup: last -10s unaligned of critical
    units: checks
    every: 10s
    warn: '$this > 0'
    delay: down 2m multiplier 1.5 max 30m
    info: Consul health checks are critical
    to: sysadmin

  - name: battery_low
    on: powersupply.capacity
    class: Utilization
    type: System
    component: Power
    lookup: min -1m unaligned of capacity
    units: '%'
    every: 1m
    warn: '$this < (($status >= $WARNING) ? (20) : (10))'
    crit: '$this < (($status == $CRITICAL) ? (10) : (5))'
    delay: down 15m multiplier 1.5 max 1h
    info: battery / power-supply remaining capacity
    to: sysadmin

  - name: whois_expiration
    on: whoisquery.time_until_expiration
    class: Latency
    type: Service
    component: WHOIS
    lookup: min -1m unaligned of days
    units: days
    every: 1h
    warn: '$this < (($status >= $WARNING) ? (30) : (14))'
    crit: '$this < (($status == $CRITICAL) ? (7) : (2))'
    delay: down 1d multiplier 1.5 max 7d
    info: domain registration days until expiration
    to: sysadmin

  - name: ntpd_unsynchronized
    on: ntpd.sys_stratum
    class: Availability
    type: System
    component: NTP
    lookup: last -30s unaligned of stratum
    units: stratum
    every: 10s
    warn: '$this > 15 || $this < 1'
    delay: down 2m multiplier 1.5 max 30m
    info: NTPd stratum is 0 or 16 (unsynchronised)
    to: sysadmin

  - name: chrony_unsynchronised
    on: chrony.leap_status
    class: Availability
    type: System
    component: NTP
    lookup: last -30s unaligned of unsynchronised
    units: 'status'
    every: 10s
    warn: '$this > 0.5'
    delay: down 2m multiplier 1.5 max 30m
    info: Chrony leap status is unsynchronised
    to: sysadmin

  - name: mongodb_connections
    on: mongodb.connections
    class: Utilization
    type: Database
    component: MongoDB
    lookup: average -1m unaligned of current
    units: connections
    every: 10s
    warn: '$this > 80'
    delay: down 5m multiplier 1.5 max 1h
    info: MongoDB currently open connections
    to: sysadmin

  - name: apcupsd_on_battery
    on: apcupsd.ups_status
    class: Availability
    type: System
    component: UPS
    lookup: last -10s unaligned of onbattery
    units: 'status'
    every: 10s
    warn: '$this > 0.5'
    delay: down 1m multiplier 1.5 max 15m
    info: UPS is running on battery
    to: sysadmin

  - name: smartctl_failed
    on: smartctl.device_smart_status
    class: Errors
    type: System
    component: Disk
    lookup: last -1m unaligned of failed
    units: 'status'
    every: 1m
    crit: '$this > 0.5'
    delay: down 15m multiplier 1.5 max 1h
    info: disk SMART health check failed
    to: sysadmin

  - name: nvme_percentage_used
    on: nvme.device_percentage_used
    class: Utilization
    type: System
    component: Disk
    lookup: last -1m unaligned of used
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (95))'
    delay: down 1h multiplier 1.5 max 1d
    info: NVMe percentage used (endurance)
    to: sysadmin

  - name: lvm_data_full
    on: lvm.lv_data_percent
    class: Utilization
    type: System
    component: Disk
    lookup: last -1m unaligned of data
    units: '%'
    every: 1m
    warn: '$this > (($status >= $WARNING) ? (80) : (90))'
    crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
    delay: down 15m multiplier 1.5 max 1h
    info: LVM logical volume data percent
    to: sysadmin

  - name: zookeeper_outstanding
    on: zookeeper.requests
    class: Latency
    type: Database
    component: ZooKeeper
    lookup: average -1m unaligned of outstanding
    units: requests
    every: 10s
    warn: '$this > 10'
    delay: down 2m multiplier 1.5 max 30m
    info: ZooKeeper outstanding requests
    to: sysadmin

  - name: tomcat_errors
    on: tomcat.connector_errors
    class: Errors
    type: Service
    component: Tomcat
    lookup: sum -1m unaligned absolute of errors
    units: errors
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Tomcat request errors in the last minute
    to: sysadmin

  - name: traefik_5xx
    on: traefik.entrypoint_requests
    class: Errors
    type: Service
    component: Traefik
    lookup: sum -1m unaligned absolute of 5xx
    units: requests
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Traefik 5xx responses in the last minute
    to: sysadmin

  - name: bind_servfail
    on: bind.nsstats
    class: Errors
    type: Service
    component: DNS
    lookup: sum -1m unaligned absolute of servfail
    units: queries
    every: 1m
    warn: '$this > 20'
    delay: down 5m multiplier 1.5 max 1h
    info: BIND SERVFAIL answers in the last minute
    to: sysadmin

  - name: coredns_panics
    on: coredns.dns_panic_count_total
    class: Errors
    type: Service
    component: DNS
    lookup: sum -5m unaligned absolute of panics
    units: panics
    every: 1m
    warn: '$this > 0'
    delay: down 15m multiplier 1.5 max 1h
    info: CoreDNS panics in the last 5 minutes
    to: sysadmin

  - name: hdfs_missing_blocks
    on: hdfs.blocks
    class: Errors
    type: Database
    component: HDFS
    lookup: last -30s unaligned of missing
    units: blocks
    every: 10s
    warn: '$this > 0'
    delay: down 5m multiplier 1.5 max 1h
    info: HDFS missing blocks
    to: sysadmin

  - name: postfix_queue
    on: postfix.qemails
    class: Workload
    type: Service
    component: Mail
    lookup: last -1m unaligned of emails
    units: emails
    every: 1m
    warn: '$this > 100'
    crit: '$this > 1000'
    delay: down 15m multiplier 1.5 max 1h
    info: Postfix mail queue length
    to: sysadmin

  - name: exim_queue
    on: exim.qemails
    class: Workload
    type: Service
    component: Mail
    lookup: last -1m unaligned of emails
    units: emails
    every: 1m
    warn: '$this > 100'
    crit: '$this > 1000'
    delay: down 15m multiplier 1.5 max 1h
    info: Exim mail queue length
    to: sysadmin

  - name: dovecot_auth_failures
    on: dovecot.auth
    class: Errors
    type: Service
    component: Mail
    lookup: sum -1m unaligned absolute of failed
    units: attempts
    every: 1m
    warn: '$this > 20'
    delay: down 5m multiplier 1.5 max 1h
    info: Dovecot authentication failures in the last minute
    to: sysadmin

  - name: fail2ban_banned
    on: fail2ban.jail_banned_ips
    class: Errors
    type: System
    component: Security
    lookup: last -30s unaligned of banned
    units: addresses
    every: 10s
    warn: '$this > 10'
    delay: down 15m multiplier 1.5 max 1h
    info: Fail2ban currently banned addresses
    to: sysadmin

  - name: weblog_5xx
    on: web_log.status_code_class_responses
    class: Errors
    type: Service
    component: Web
    lookup: sum -1m unaligned absolute of 5xx
    units: responses
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Web log 5xx responses in the last minute
    to: sysadmin

  - name: squidlog_5xx
    on: squidlog.http_status_code_class_responses
    class: Errors
    type: Service
    component: Web
    lookup: sum -1m unaligned absolute of 5xx
    units: responses
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Squid log 5xx responses in the last minute
    to: sysadmin

  - name: freeradius_rejects
    on: freeradius.authentication_access_responses
    class: Errors
    type: Service
    component: Auth
    lookup: sum -1m unaligned absolute of rejects
    units: packets
    every: 1m
    warn: '$this > 20'
    delay: down 5m multiplier 1.5 max 1h
    info: FreeRADIUS access rejects in the last minute
    to: sysadmin

  - name: kubelet_runtime_errors
    on: k8s_kubelet.kubelet_runtime_operations_errors
    class: Errors
    type: Service
    component: Kubernetes
    lookup: sum -1m unaligned absolute of *
    units: errors
    every: 1m
    warn: '$this > 0'
    delay: down 5m multiplier 1.5 max 1h
    info: Kubelet runtime operation errors in the last minute
    to: sysadmin

  - name: k8s_apiserver_5xx
    on: k8s_apiserver.requests_by_code
    class: Errors
    type: Service
    component: Kubernetes
    lookup: sum -1m unaligned absolute of 5xx
    units: requests
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Kubernetes API server 5xx responses in the last minute
    to: sysadmin

  - name: k8s_node_not_ready
    on: k8s_state.node_condition
    class: Availability
    type: System
    component: Kubernetes
    lookup: last -30s unaligned of Ready
    units: state
    every: 10s
    warn: '$this < 1'
    delay: down 2m multiplier 1.5 max 30m
    info: Kubernetes node Ready condition is not True
    to: sysadmin

  - name: k8s_pods_failed
    on: k8s_state.node_pods_phase
    class: Errors
    type: System
    component: Kubernetes
    lookup: last -30s unaligned of failed
    units: pods
    every: 10s
    warn: '$this > 0'
    delay: down 5m multiplier 1.5 max 1h
    info: Kubernetes node has pods in Failed phase
    to: sysadmin

  - name: zfspool_degraded
    on: zfspool.pool_health_state
    class: Errors
    type: System
    component: ZFS
    lookup: last -30s unaligned of degraded
    units: state
    every: 10s
    warn: '$this > 0'
    delay: down 5m multiplier 1.5 max 1h
    info: ZFS pool is degraded
    to: sysadmin

  - name: upsd_on_battery
    on: upsd.ups_status
    class: Availability
    type: System
    component: UPS
    lookup: last -10s unaligned of on_battery
    units: status
    every: 10s
    warn: '$this > 0.5'
    delay: down 1m multiplier 1.5 max 15m
    info: NUT UPS is running on battery
    to: sysadmin

  - name: proxysql_slow_queries
    on: proxysql.slow_queries
    class: Latency
    type: Database
    component: ProxySQL
    lookup: sum -1m unaligned absolute of slow_queries
    units: queries
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: ProxySQL slow queries in the last minute
    to: sysadmin

  - name: envoy_5xx
    on: envoy.http_downstream_rq
    class: Errors
    type: Service
    component: Envoy
    lookup: sum -1m unaligned absolute of 5xx
    units: requests
    every: 1m
    warn: '$this > 10'
    delay: down 5m multiplier 1.5 max 1h
    info: Envoy downstream 5xx responses in the last minute
    to: sysadmin

  - name: filecheck_missing
    on: filecheck.file_existence_status
    class: Availability
    type: System
    component: Files
    lookup: last -30s unaligned of not_exist
    units: status
    every: 10s
    warn: '$this > 0.5'
    delay: down 5m multiplier 1.5 max 1h
    info: Watched file is missing
    to: sysadmin

  - name: supervisord_not_running
    on: supervisord.summary_processes
    class: Availability
    type: Service
    component: Supervisord
    lookup: last -30s unaligned of non-running
    units: processes
    every: 10s
    warn: '$this > 0'
    delay: down 2m multiplier 1.5 max 30m
    info: Supervisord has processes that are not running
    to: sysadmin

  - name: monit_service_error
    on: monit.services
    class: Errors
    type: Service
    component: Monit
    lookup: last -30s unaligned of error
    units: services
    every: 10s
    warn: '$this > 0'
    delay: down 2m multiplier 1.5 max 30m
    info: Monit reports services in error
    to: sysadmin

  - name: snmp_interface_down
    on: snmp.device_net_operstatus
    class: Availability
    type: System
    component: SNMP
    lookup: last -30s unaligned of down
    units: state
    every: 10s
    warn: '$this > 0.5'
    delay: down 2m multiplier 1.5 max 30m
    info: SNMP interface operational status is down
    to: sysadmin

  - name: cockroachdb_no_live_nodes
    on: cockroachdb.live_nodes
    class: Availability
    type: Database
    component: CockroachDB
    lookup: last -30s unaligned of live_nodes
