plugins:
  enabled: true
  dir: plugins.d       # every executable *.plugin here is started as "<file> <update_every>"
  disabled: []         # plugin names not to start, e.g. ["example"]
  list:                # explicit plugins (any language); command relative to dir or on PATH
    # - name: python_example
    #   command: python3
    #   args: [plugins.d/python_example.plugin.py]
    #   update_every: 5     # default global.update_every
    #   timeout: 120        # kill + restart after this many seconds without output (default 10×update_every, min 60)
    #   env: ["MY_TOKEN=..."]

health:
  enabled: true
  builtin: true        # load the rules shipped with the agent
  dir: health.d        # extra *.yaml rule files, relative to this config file; same name overrides a built-in
  log_keep: 1000       # alarm log entries kept in memory (full history in <data_dir>/health/alarm-log.jsonl)
  silent: false        # true = evaluate and log, but never notify
  alarms: []           # inline rules, e.g.
  # - name: ram_in_use
  #   on: system.ram                      # chart id, or a context (e.g. disk.space) to bind every matching chart
  #   lookup: average -1m percentage of used
  #   units: '%'
  #   every: 10s
  #   warn: '$this > (($status >= $WARNING) ? (80) : (90))'
  #   crit: '$this > (($status == $CRITICAL) ? (90) : (98))'
  #   delay: down 15m multiplier 1.5 max 1h
  #   repeat: warning 1h critical 15m
  #   info: system memory utilization
  #   to: sysadmin
  notify:
    roles: {}          # alarm `to:` → channels, e.g. sysadmin: [slack, email]; unknown/empty role = all channels
    webhook:
      url: ""          # POST LogEntry JSON
      headers: {}
    slack:
      webhook_url: ""  # Slack / Mattermost / Rocket.Chat incoming webhook
      channel: ""
    email:
      server: ""       # smtp.example.com:587 (STARTTLS) or :465 (TLS)
      from: ""
      to: []
      username: ""
      password: ""
      # skip TLS verification and allow AUTH over plaintext (not recommended)
      insecure_skip_verify: false
    dingtalk:
      webhook_url: ""    # 钉钉自定义机器人
    wecom:
      webhook_url: ""    # 企业微信群机器人
    feishu:
      webhook_url: ""    # 飞书自定义机器人
    telegram:
      token: ""          # Bot token from @BotFather
      chat_id: ""
    discord:
      webhook_url: ""
    pagerduty:
      routing_key: ""    # Events API v2 routing key

# Types: graphite (TCP line protocol), influx (InfluxDB 1.x /write), json (HTTP POST),
# prometheus (Prometheus remote write: snappy + protobuf), opentsdb (/api/put JSON),
# mongodb (OP_MSG insert into database.collection).
export:
  destinations: []
  # - { type: graphite, address: "127.0.0.1:2003", prefix: monitor, every: 10s }
  # - { type: influx, url: "http://127.0.0.1:8086/write?db=monitor", prefix: monitor, every: 10s }
  # - { type: json, url: "http://127.0.0.1:9000/ingest", every: 10s }
  # - { type: prometheus, url: "http://127.0.0.1:9090/api/v1/write", prefix: monitor, every: 10s }
  # - { type: opentsdb, url: "http://127.0.0.1:4242/api/put", prefix: monitor, every: 10s }
  # - { type: mongodb, address: "127.0.0.1:27017", database: netdata, collection: metrics, prefix: monitor, every: 10s }

# HTTPS collectors (Kubernetes, Redfish, Puppet, PAN-OS, PowerStore/PowerVault,
# ScaleIO, VCSA, vSphere) verify server certificates by default.
# Add beneath the relevant collectors.modules.<name> mapping:
#   tls:
#     ca_file: /path/to/private-ca.pem
#     insecure_skip_verify: false
# Existing self-signed endpoints must configure their CA (preferred), or
# explicitly opt into insecure_skip_verify: true for isolated test deployments.
