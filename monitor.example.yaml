# monitord configuration. Copy to monitor.yaml (or pass -config <path>).
# Every key is optional; the values below are the defaults.

mode: agent            # agent: collect + serve locally | hub: also accept streamed nodes (see `hub:` below)

global:
  hostname: ""         # empty = OS hostname
  update_every: 1      # seconds between collections (1 = per-second, like Netdata)
  data_dir: ./data     # TSDB + metadata live here

db:
  tier0_retention: 336h        # 14 days of per-second data
  tier0_retention_size: 1GiB   # or delete oldest blocks beyond this size
  checkpoint: 30s              # flush in-memory samples to disk this often
  tiers: 3                     # 1 = raw only, 2 = +1-minute rollups, 3 = +1-hour rollups
  tier1_retention: 2160h       # 90 days of per-minute min/max/avg/sum/count
  tier2_retention: 17520h      # 2 years of per-hour rollups

web:
  listen: ":19999"
  allow_from: []       # CIDRs allowed to reach the API/UI, e.g. ["10.0.0.0/8", "127.0.0.1"]
  token: ""            # if set, /api and /metrics require ?token= or "Authorization: Bearer" (admin)
  users: []            # named credentials with roles; any token/users setting turns anonymous access off
  # - { name: ops,   token: "change-me-1", role: admin }          # everything, incl. DELETE /api/v1/nodes
  # - { name: oncall, token: "change-me-2", role: troubleshooter } # read + Functions (processes table…)
  # - { name: tv,    token: "change-me-3", role: viewer }         # read-only metrics/alarms/nodes
  oidc:                  # optional OpenID Connect; login at /api/v1/auth/oidc/login
    issuer: ""           # e.g. https://login.example.com
    client_id: ""
    client_secret: ""
    redirect_url: ""     # e.g. http://hub:19999/api/v1/auth/oidc/callback
    role: viewer         # minted session role: admin | troubleshooter | viewer

# Agent → Hub streaming (outbound WebSocket, so agents behind NAT only need to reach the hub).
# Host info, chart definitions, per-second samples, alarm transitions and Functions are
# forwarded; after a disconnect the gap is replicated from the local TSDB.
stream:
  enabled: false
  destinations: []     # tried in order, e.g. ["wss://hub.example.com", "10.0.0.5:19999"] (path defaults to /api/v1/stream)
  api_key: ""          # must be listed in the hub's hub.api_keys
  claim_token: ""      # one-time token from POST /api/v1/hub/claim-tokens; minted into api_key on first connect
  insecure_skip_verify: false
  timeout: 10s
  replicate: 1h        # at most this much history is re-sent after reconnecting

# Hub side (mode: hub): accept nodes. Each node gets its own registry + TSDB namespace;
# query them with `?node=<id>` on the usual API and pick them in the dashboard.
hub:
  api_keys: []         # empty = ingestion disabled; e.g. ["change-me-stream-key"]
  replicate: 24h       # max backfill accepted from agents
  # A node stays bound to the api key that first registered it (give each agent
  # its own key so one cannot impersonate another). Ingest quotas, 0 = default:
  max_nodes: 0             # 1000
  max_charts_per_node: 0   # 5000
  max_dims_per_chart: 0    # 1000
  peers: []                # other hub base URLs, e.g. ["http://hub2:19999"]
  peer_token: ""           # Bearer token presented to peers (usually their web.token); also required on POST /api/v1/hub/ring
  space: default           # created on first hub start if org.json is empty
  room: default

collectors:
  enabled: []          # empty = all available: cpu load mem disk diskspace net uptime apps systemd docker nginx redis apache phpfpm memcached mysql postgres elasticsearch rabbitmq proc sensors netstat statsd prometheus otlp httpcheck portcheck ping sslcheck dnsquery nvidia logs ml haproxy lighttpd consul whoisquery mongodb pgbouncer chrony ntpd smartctl nvme apcupsd lvm zookeeper nats varnish squid tomcat traefik bind unbound coredns hdfs postfix exim dovecot fail2ban weblog squidlog openldap wireguard samba freeradius tor cgroup k8s_kubelet k8s_kubeproxy k8s_apiserver k8s_state proxysql clickhouse cockroachdb pulsar envoy upsd zfspool dmcache filecheck supervisord monit snmp fluentd logstash cassandra ceph couchdb couchbase hddtemp openvpn beanstalk uwsgi powerdns dnsmasq megacli hpssa adaptecraid redfish activemq gearman geth ipfs pihole powerdns_recursor rspamd typesense storcli nginxvts tengine nsd dnsdist dnsmasq_dhcp isc_dhcpd puppet openvpn_status_log rethinkdb yugabytedb vernemq icecast phpdaemon pika maxscale nginxplus nginxunit docker_engine riakkv litespeed boinc spigotmc w1sensor ap dockerhub ethtool intelgpu logind dcgm panos powerstore powervault s3check scaleio smbios_memory vcsa mssql oracledb sql cloudwatch azure_monitor vsphere cato_networks snmp_traps snmp_topology freebsd windows
  disabled: []         # e.g. ["diskspace", "statsd"]; service modules auto-disable when the target is unreachable
  modules:             # per-collector settings (collectors.modules.<name>)
    apps:              # processes grouped into applications (apps.cpu/mem/processes/threads/io_*) + `processes` function
      defaults: true   # built-in groups (ssh, database, httpd, containers, browser, …)
      cmdline: false   # also match patterns against the full command line
      top: 200         # max rows returned by the `processes` function
      groups: {}       # extra/overriding groups: name → glob patterns, e.g. { myapp: ["myapp*", "worker-*"] }
    systemd:           # linux, cgroup v2: per-service cpu/mem/io from /sys/fs/cgroup/system.slice
      cgroup_root: /sys/fs/cgroup
      slices: [system.slice]
      include: []      # unit-name globs; empty = all
      exclude: []
    docker:            # Docker Engine API: per-container cpu/mem/net/blkio
      address: ""      # default unix:///var/run/docker.sock (DOCKER_HOST honored); tcp://host:2375 on Windows
      timeout: 5s
      exclude: ["k8s_POD.*"]
    nginx:
      url: http://127.0.0.1/stub_status
      timeout: 2s
    apache:
      url: http://127.0.0.1/server-status?auto
      timeout: 2s
    phpfpm:
      url: http://127.0.0.1/status
      timeout: 2s
    memcached:
      address: 127.0.0.1:11211
      timeout: 2s
    prometheus:          # scrape any OpenMetrics / Prometheus /metrics
      timeout: 5s
      jobs: []           # e.g. [{ name: node, url: http://127.0.0.1:9100/metrics }]
    statsd:              # UDP StatsD listener (counters/gauges/timers)
      listen: 127.0.0.1:8125
    httpcheck:           # synthetic HTTP checks
      timeout: 5s
      jobs: []           # e.g. [{ name: local, url: http://127.0.0.1:19999/healthz }]
    portcheck:
      timeout: 2s
      jobs: []           # e.g. [{ name: ssh, host: 127.0.0.1, port: 22 }]
    ping:
      timeout: 2s
      jobs: []           # e.g. [{ name: gw, host: 1.1.1.1, protocol: icmp }]
    ml:                  # edge anomaly detection (k-means + k-sigma fallback)
      enabled: true
      window: 120
      sigma: 3
      lag: 3             # k-means feature length (first-differences)
      k: 2
      models: 4          # vote across different training windows
      min_train: 900     # samples before first model; tests may lower this
      train_every: 3h
      max_train_samples: 14400
      threshold: 0.99    # percentile of training distances
    mysql:
      address: 127.0.0.1:3306
      user: root
      password: ""
      timeout: 2s
    postgres:
      address: 127.0.0.1:5432
      user: ""                 # empty = current OS user
      password: ""
      database: postgres
      timeout: 2s
    elasticsearch:
