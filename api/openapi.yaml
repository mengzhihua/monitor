openapi: 3.0.3
info:
  title: Monitor API
  version: "2.0.0-dev"
  description: |
    Agent and Hub HTTP API. The hand-written Flutter client in app/lib/api
    follows this contract. Authenticated routes take Authorization: Bearer.
servers:
  - url: http://127.0.0.1:19999
paths:
  /api/v1/alert_config:
    get:
      summary: Local effective alert rules and persisted overrides
      description: Also available at /api/v3/alert_config with api=3. Includes deleted base rules and orphan deletion markers. Accepts name or hash to return one config. Non-local node selectors rejected. Cache-Control no-store.
      responses:
        "200":
          description: Local snapshot, or api/config/revision/persistent for a single match
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRulesSnapshot'}
        "404": {description: Health engine or rule unavailable}
    post:
      summary: Atomically create a batch of local rules
      description: Authenticated admin only. Alias /api/v3/alert_config. Accepts single RuleSpec JSON, config wrapper, alarms array wrapper, or YAML alarms list. All rules must be valid and new; no partial changes. Unknown fields, multiple documents and ambiguous wrappers rejected. Maximum 1 MiB. Optional revision query protects concurrent changes; absent revision preserves unconditional legacy writes. Persists before publication.
      parameters:
        - {in: query, name: revision, schema: {type: string, maxLength: 128}}
      responses:
        "200": {description: Snapshot metadata and submitted configs only}
        "400": {description: Invalid rule or body}
        "403": {description: Authenticated administrator required}
        "409": {description: Revision changed or name exists; whole batch unchanged}
        "413": {description: Request exceeds 1 MiB}
        "422": {description: Override or file capacity reached}
        "503": {description: Persistence failed; rules unchanged}
    put:
      summary: Atomically create or replace local rules
      description: Same admin contract, body, persistence and optional revision query as POST; permits existing names. Alias /api/v3/alert_config.
      responses:
        "200": {description: Submitted configs with new revision and persistent flag}
        "409": {description: Stale revision; whole batch unchanged}
    delete:
      summary: Delete a local rule
      description: Authenticated admin only. Optional revision query. Alias /api/v3/alert_config. Base rules retain a deletion marker for reset.
      parameters:
        - {in: query, name: name, required: true, schema: {type: string}}
        - {in: query, name: revision, schema: {type: string, maxLength: 128}}
      responses:
        "200": {description: api, deleted name, new revision, persistent}
        "404": {description: Rule or health engine unavailable}
        "409": {description: Stale revision; rules unchanged}
  /api/v1/manage/alert-rules/preview:
    post:
      summary: Validate a local rule mutation and preview matching charts
      description: Authenticated admin only. Same revision, compilation, existence and capacity checks as saving. Does not evaluate expressions/history, modify rules or send notifications. Scope matching includes disabled rules; at most 50 chart details. Chart inventory may change after preview. Non-local node selectors rejected. Cache-Control no-store.
      requestBody: &alertRuleMutationBody
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRuleMutation'}
      responses:
        "200": {description: 'revision, action, name, valid=true, persistent, disabled, matched count, charts (id/title/context/family), truncated, limit=50 and notice. Orphan deletion reset has zero matches.'}
        "400": {description: Invalid request or missing revision}
        "401": {description: Authentication required}
        "403": {description: Authenticated administrator required}
        "404": {description: Rule or health engine unavailable}
        "409": {description: Stale revision or create name exists}
        "413": {description: Request exceeds 1 MiB}
        "422": {description: At most 1000 overrides and deletion markers and 4 MiB file}
  /api/v1/manage/alert-rules:
    post:
      summary: Persist a local rule mutation with optimistic concurrency
      description: Same admin, body and validation contract as preview; revalidates at commit. No preview token required. Private file is replaced before publishing runtime changes. Reset exposes current startup configuration, not necessarily builtin defaults. Old revisions including before restart fail. After a lost response, read current state before retrying. Dispatched notifications cannot be withdrawn. Cache-Control no-store.
      requestBody: *alertRuleMutationBody
      responses:
        "200":
          description: Complete updated snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRulesSnapshot'}
        "400": {description: Invalid request or missing revision}
        "401": {description: Authentication required}
        "403": {description: Authenticated administrator required}
        "404": {description: Rule or health engine unavailable}
        "409": {description: Stale revision or name conflict; no changes saved}
        "413": {description: Request exceeds 1 MiB}
        "422": {description: Override or file capacity reached}
        "503": {description: Persistence failed; rules unchanged}
  /api/v1/operations:
    get:
      summary: Global fleet resources, active problems and recent handling history
      description: Ignores chart node selection. Metrics are nullable and carry sample freshness. Includes local and Hub-owned alarms; peer-only alarm coverage is unknown.
      responses:
        "200":
          description: Snapshot with now, nodes, problems, summary, activity (latest 100 handled episodes), persistent, current_user and assignees (eligible configured operators plus the current eligible identity; no credentials). Summary includes unassigned, open, investigating and watching counts across current problems.
        "401":
          description: Authentication required
  /api/v1/operations/handling/batch:
    post:
      summary: Atomically apply one handling action to explicitly selected problem episodes
      description: Admin and troubleshooter only. Actor and alarm context come from the server. Ignores chart node selection; never expands a filter into extra targets. Every episode must still be active and each handling revision must match. One store lock and one file replacement publish all records; conflict, capacity or disk errors publish none. Health evaluation continues independently and new episode IDs never inherit handling. Request limit 16384 bytes; response Cache-Control no-store. Lost network responses require checking current records before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, items]
              properties:
                action: {type: string, enum: [acknowledge, unacknowledge, comment, assign, unassign, progress]}
                note: {type: string, description: At most 2048 UTF-8 bytes after trimming; required and nonempty for comment.}
                assignee: {type: string, description: Required only for assign; must name an eligible operator.}
                status: {type: string, enum: [open, investigating, watching], description: Required only for progress.}
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, revision]
                    properties:
                      id: {type: string, pattern: '^[0-9a-f]{64}$', description: Unique active problem episode ID.}
                      revision: {type: integer, minimum: 0}
      responses:
        "200":
          description: count and records in requested order; each record contains its new revision, context, handling state and separate actor/action history.
        "400":
          description: Invalid change, count, duplicate ID, unknown fields or missing revision
        "401":
          description: Authentication required
        "403":
          description: Read-only role
        "409":
          description: One or more episodes or revisions changed; no batch changes saved
        "503":
          description: Storage capacity or write failure; no batch changes saved
  /api/v1/operations/views:
    get:
      summary: Read the current account's personal operations views
      description: Ignores node selection. Static credentials use separate token-derived namespaces (rotation creates a new space); OIDC uses verified issuer and subject; LDAP uses directory configuration and exact login name. Anonymous and temporary share-link callers receive enabled=false and an empty collection. No owner parameter or cross-account API. Cache-Control no-store.
      responses:
        "200":
          description: revision, views, enabled, persistent, limit (10), and user (name and role only). Empty views is an array. No credentials or principal keys.
        "401":
          description: Authentication required
    post:
      summary: Replace only the current account's view collection
      description: All authenticated account roles including viewer may maintain their own filters. This does not grant alarm handling permissions. Requires the last read revision; successful writes increment it even when deleting all views. Concurrent stale requests fail without changing state. At most 10 uniquely named views per account, 1000 account spaces including deletion tombstones, and 16 MiB storage. No automatic eviction. Request body limit 32768 bytes. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, views]
              properties:
                revision: {type: integer, minimum: 0, maximum: 9007199254740991}
                views:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, severity, nodeStatus, ownerFilter, progressFilter]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 40, description: Unique within this account; no leading or trailing whitespace or control characters.}
                      query: {type: string, default: "", description: At most 1024 UTF-8 bytes; no control characters.}
                      severity: {type: string, enum: [all, WARNING, CRITICAL]}
                      nodeStatus: {type: string, enum: [all, live, stale, offline]}
                      pendingOnly: {type: boolean, default: false}
                      ownerFilter: {type: string, enum: [all, mine, unassigned, assigned]}
                      progressFilter: {type: string, enum: [all, open, investigating, watching]}
      responses:
        "200":
          description: Updated collection using the GET response shape, persisted before publication.
        "400":
          description: Invalid JSON, unknown fields, missing revision, invalid filters, duplicate names or too many views
        "401":
          description: Authentication required
        "403":
          description: Anonymous or temporary share-link callers cannot persist personal views
        "409":
          description: Collection changed; reload and review before retrying
        "422":
          description: Account or file storage capacity reached
        "503":
          description: Persistence failed; in-memory collection unchanged
  /api/v1/operations/history:
    get:
      summary: Search all retained handling episodes with consistent pagination
      description: Authenticated readers, including viewers. Sorted by latest retained action time descending, then episode ID. Actor search covers retained actions only. A successful handling write or service restart invalidates old cursors; resume with a fresh query after 409. This endpoint does not infer alarm recovery.
      parameters:
        - &historySearch {in: query, name: q, schema: {type: string}, description: Case-insensitive search of host/node/chart/alarm/owner and retained operator notes; maximum 256 UTF-8 bytes.}
        - &historyNode {in: query, name: node, schema: {type: string}, description: Exact node ID; maximum 256 UTF-8 bytes.}
        - &historyAssignee {in: query, name: assignee, schema: {type: string}, description: Exact stored owner name; maximum 128 UTF-8 bytes.}
        - &historyActor {in: query, name: actor, schema: {type: string}, description: Exact actor name in retained actions; maximum 128 UTF-8 bytes.}
        - &historyStatus {in: query, name: status, schema: {type: string, enum: [open, investigating, watching]}}
        - &historySeverity {in: query, name: severity, schema: {type: string, enum: [WARNING, CRITICAL]}}
        - &historyAcknowledged {in: query, name: acknowledged, schema: {type: string, enum: ["true", "false"]}}
        - &historyFrom {in: query, name: from, schema: {type: integer, format: int64, minimum: 0}, description: Inclusive last-handled Unix timestamp lower bound.}
        - &historyUntil {in: query, name: until, schema: {type: integer, format: int64, minimum: 0}, description: Inclusive upper bound; 0 means unbounded.}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 1024}, description: Opaque next_cursor from a previous response with identical filters.}
      responses:
        "200":
          description: records, total matching episodes, stored count, capacity, actions_per_record, snapshot, next_cursor and normalized filter. Records include updated_at and history_truncated. Empty results return an empty records array.
        "400":
          description: Invalid filter, range, page size or cursor, or filters differ from the cursor's query
        "401":
          description: Authentication required
        "409":
          description: History changed or service restarted; restart query
  /api/v1/operations/history/export:
    get:
      summary: Download all matching retained handling records as JSON or CSV
      description: Same read permissions and filters as history search. Requires the snapshot returned by a successful list query. No cursor; exports every matching episode, bounded by storage capacity (5000 episodes and 20 retained actions each). JSON preserves text; CSV contains one row per retained action, UTF-8 BOM, and formula protection on hazardous text. An export is a consistent copy at request time, not a restorable deployment backup.
      parameters:
        - *historySearch
        - *historyNode
        - *historyAssignee
        - *historyActor
        - *historyStatus
        - *historySeverity
        - *historyAcknowledged
        - *historyFrom
        - *historyUntil
        - {in: query, name: snapshot, required: true, schema: {type: string, minLength: 64, maxLength: 64}}
        - {in: query, name: format, required: true, schema: {type: string, enum: [json, csv]}}
      responses:
        "200":
          description: Download attachment; JSON uses the history response shape with all matching records and empty next_cursor. CSV includes problem context, current handling state, truncation flag and action details. Cache-Control no-store.
        "400":
          description: Invalid filter, format, cursor or missing snapshot
        "401":
          description: Authentication required
        "409":
          description: History changed or service restarted since the query; query again before exporting
  /api/v1/operations/acknowledgements:
    post:
      summary: Acknowledge, unacknowledge or comment on the current alarm episode
      description: Admin and troubleshooter only. Actor is taken from authenticated identity. Confirmation does not silence or resolve alarms. Each episode retains the latest 20 actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, action, revision]
              properties:
                id: {type: string, minLength: 64, maxLength: 64}
                action: {type: string, enum: [acknowledge, unacknowledge, comment]}
                revision: {type: integer, minimum: 0}
                note:
                  type: string
                  description: Maximum 2048 UTF-8 bytes; non-empty for comment.
      responses:
        "200":
          description: Saved record with problem context, acknowledged, revision and history.
        "400":
          description: Invalid action, note or JSON body
        "401":
          description: Authentication required
        "403":
          description: Read-only role
        "409":
          description: Episode recovered or changed, or record revision changed
        "503":
          description: Record could not be persisted
  /api/v1/operations/handling:
    post:
      summary: Assign an operator and track human investigation progress
      description: Admin and troubleshooter only. Also accepts acknowledgement actions. Actor comes from authentication. Assignment and progress do not confirm, silence or resolve the alarm. Changes apply only to the current severity episode and require its current revision. An assign target must appear in this caller's assignees list. New alarm episodes start unassigned with open progress. No external notification is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, action, revision]
              properties:
                id: {type: string, minLength: 64, maxLength: 64}
                action: {type: string, enum: [acknowledge, unacknowledge, comment, assign, unassign, progress]}
                revision: {type: integer, minimum: 0}
                note:
                  type: string
                  description: Optional except for comment; maximum 2048 UTF-8 bytes.
                assignee:
                  type: string
                  description: Required and non-empty for assign only; maximum 128 UTF-8 bytes; no control characters. Unassign clears the owner.
                status:
                  type: string
                  enum: [open, investigating, watching]
                  description: Required for progress only. Never represents alarm recovery.
      responses:
        "200":
          description: Saved record with problem, acknowledged, assignee, status, revision and recent 20 history actions. Assignment/progress actions include previous and new values.
        "400":
          description: Invalid action, fields, status, assignee or JSON
        "401":
          description: Authentication required
        "403":
          description: Read-only role
        "409":
          description: Episode recovered or changed, or record revision changed
        "503":
          description: Record could not be persisted
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: process is serving
  /api/v1/info:
    get:
      summary: Agent or hub identity
      responses:
        "200":
          description: info
  /api/v1/charts:
    get:
      summary: Chart catalog
      responses:
        "200":
          description: charts
  /api/v1/data:
    get:
      summary: Samples for one chart or context
      parameters:
        - in: query
          name: chart
          schema: {type: string}
        - in: query
          name: after
          schema: {type: integer}
      responses:
        "200":
          description: points
  /api/v1/alarms:
    get:
      summary: Active alarms
      responses:
        "200":
          description: alarms
  /api/v1/alarms/close:
    post:
      summary: Manually close a raised alarm
      description: Admin and troubleshooter only. Zabbix-style manual close; the rule keeps evaluating and re-raises if the condition still holds. Local alarms only; node= for a remote node returns 501. Actor recorded on the log entry.
      parameters:
        - {in: query, name: node, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alarm_id]
              properties:
                alarm_id: {type: integer, format: uint64}
                comment: {type: string, maxLength: 512}
      responses:
        "200": {description: updated alarm}
        "403": {description: insufficient role}
        "404": {description: alarm id unknown or health engine disabled}
        "409": {description: alarm is not raised}
        "501": {description: node= refers to a remote node}
  /api/v1/audit:
    get:
      summary: Audit log entries
      description: Admin only. Newest first. Mutating /api calls and login/login_failed auth events; reads and ingest endpoints are not recorded.
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64}}
        - {in: query, name: limit, schema: {type: integer, maximum: 1000}}
        - {in: query, name: user, schema: {type: string}}
      responses:
        "200": {description: "{entries:[{ts,user,role,remote,method,path,action,target,status}]}"}
        "403": {description: admin only}
        "404": {description: audit disabled}
  /api/v1/collectors:
    get:
      summary: Collector status
      responses:
        "200":
          description: collectors
  /api/v1/functions:
    get:
      summary: On-demand functions
      responses:
        "200":
          description: functions
  /api/v1/nodes:
    get:
      summary: Nodes visible to this process
      responses:
        "200":
          description: nodes
  /api/v1/hub/templates:
    get:
      summary: Zabbix-style hub templates (list, or one with ?id=)
      responses:
        "200": {description: templates}
        "404": {description: unknown id or not a hub}
    put:
      summary: Create/update a template (CAS via if_updated; optional rules_yaml)
      responses:
        "200": {description: saved template}
        "400": {description: invalid rules or body}
        "409": {description: revision conflict}
    delete:
      summary: Delete a template (?id=)
      responses:
        "200": {description: deleted}
        "404": {description: unknown id}
  /api/v1/hub/templates/effective:
    get:
      summary: Resolved template overlay for a node (?node=)
      responses:
        "200": {description: HealthOverlay with rev, templates, macros, rules, removed, disabled, tags, rule_source}
        "400": {description: node parameter required}
  /api/v1/hub/inventory:
    get:
      summary: Node inventory — all nodes, or one with ?node= ({auto, tags, manual, effective, updated})
      responses:
        "200": {description: merged inventory view}
    put:
      summary: Set manual inventory fields for a node (?node=, CAS via if_updated)
      responses:
        "200": {description: merged inventory view}
        "400": {description: node parameter required}
        "409": {description: revision conflict}
  /api/v1/hub/spaces:
    get:
      summary: Hub spaces
      responses:
        "200":
          description: spaces
        "404":
          description: this process is not a hub
components:
  schemas:
    AlertRuleSpec:
      type: object
      additionalProperties: false
      required: [name, on]
      description: lookup or calc required. Expressions use Monitor health syntax. every/delay/repeat use the existing duration grammar. disabled stops binding/evaluation.
      properties:
        name: {type: string, minLength: 1}
        on: {type: string, minLength: 1}
        class: {type: string}
        type: {type: string}
        component: {type: string}
        lookup: {type: string}
        calc: {type: string}
        every: {type: string}
        units: {type: string}
        warn: {type: string}
        crit: {type: string}
        recovery: {type: string, description: "After warn and crit are both false, the alarm stays raised until this expression is true."}
        for: {type: string}
        keep_firing_for: {type: string}
        delay: {type: string}
        repeat: {type: string}
        info: {type: string}
        to: {type: string}
        chart_labels: {type: object, additionalProperties: {type: string}}
        disabled: {type: boolean}
    AlertRuleMutation:
      type: object
      additionalProperties: false
      required: [revision, action]
      description: create/update require config and no name; delete/reset require name and no config. reset removes a dynamic override or deletion marker, including orphan markers without a base.
      properties:
        revision: {type: string, minLength: 1, maxLength: 128, description: Opaque version changes at every commit and process restart}
        action: {type: string, enum: [create, update, delete, reset]}
        config: {$ref: '#/components/schemas/AlertRuleSpec'}
        name: {type: string}
    AlertRulesSnapshot:
      type: object
      required: [api, revision, persistent, scope, hostname, can_manage, configs, count]
      properties:
        api: {type: integer, enum: [1, 3]}
        revision: {type: string}
        persistent: {type: boolean}
        scope: {type: string, enum: [local]}
        hostname: {type: string}
        can_manage: {type: boolean}
        count: {type: integer}
        configs:
          type: array
          items:
            type: object
            properties:
              hash: {type: string}
              name: {type: string}
              on: {type: string}
              source: {type: string}
              every: {type: number, description: Evaluation interval seconds}
              origin: {type: string, enum: [base, override, custom, deleted]}
              has_base: {type: boolean}
              deleted: {type: boolean}
              config: {type: object, description: RuleSpec or a name with empty on for orphan deletion markers}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
