name: Weekly soak

# 24h does not fit a GitHub-hosted runner (killed at 6h). This workflow is the
# run that used to be soak-lab inside Nightly soak, where the job was skipped
# on every schedule. It has no skip condition: Sunday 02:15 UTC+8 and a manual
# dispatch both execute on a self-hosted Linux runner (labels: self-hosted, linux).
# Actions evaluates cron in UTC, so Sunday 02:15 UTC+8 is Saturday 18:15 UTC.
# A timeout or SIGTERM is a failure. soak.py writes the partial JSON first, and
# the artifact step still uploads that file plus heap profiles.
# GitHub cancels a job that stays queued for 24h. Run 40131339050 (scheduled
# 2026-10-24 20:47 UTC, commit 82c115d) had no steps: no self-hosted,linux
# runner accepted it. Register one under Settings → Actions → Runners with
# those two labels, then run this workflow by hand. Do not expect a GitHub-hosted
# runner to finish the 24h profile.
on:
  schedule:
    - cron: "15 18 * * 6" # Saturday 18:15 UTC = Sunday 02:15 UTC+8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak-24h:
    runs-on: [self-hosted, linux]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build agent
        run: ./scripts/build.sh --dev all
      - name: Soak 24h
        run: bash scripts/ci-soak.sh lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-weekly-24h
          path: |
            reports/soak-nightly.json
            reports/soak-heaps/
            reports/rss-trend-*.log
          if-no-files-found: warn
