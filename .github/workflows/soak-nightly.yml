name: Nightly soak

# Overnight RSS/heap soak against a seeded agent data copy. Fails the job when
# memory thresholds from scripts/soak.py (≥24h defaults) are exceeded.
on:
  schedule:
    - cron: "15 18 * * *" # 02:15 UTC+8
  workflow_dispatch:
    inputs:
      seconds:
        description: "Soak duration in seconds (default 86400)"
        required: false
        default: "86400"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build agent
        run: |
          ./scripts/build.sh --dev all
      - name: Prepare seed data
        run: |
          set -euo pipefail
          mkdir -p reports/seed-data
          cat > reports/seed-config.yaml <<'YAML'
          collectors:
            enabled: [cpu, mem, load, disk, net]
          plugins:
            enabled: false
          health:
            enabled: false
          YAML
          # Warm a seed data dir the overnight soak will copy (never writes the seed).
          python3 - <<'PY'
          import pathlib, shutil, socket, subprocess, tempfile, time, urllib.request
          root = pathlib.Path('reports')
          cfg = root / 'seed-config.yaml'
          seed = root / 'seed-data'
          with tempfile.TemporaryDirectory(prefix='seed-warm-') as tmp:
              data = pathlib.Path(tmp) / 'data'
              data.mkdir()
              with socket.socket() as s:
                  s.bind(('127.0.0.1', 0))
                  port = s.getsockname()[1]
              log = open(pathlib.Path(tmp) / 'warm.log', 'w')
              proc = subprocess.Popen(
                  ['core/bin/monitord', '-config', str(cfg), '-data-dir', str(data),
                   '-listen', f'127.0.0.1:{port}'],
                  stdout=log, stderr=log,
              )
              try:
                  for _ in range(100):
                      try:
                          urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=1).close()
                          break
                      except OSError:
                          time.sleep(0.1)
                  time.sleep(20)
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait()
                  log.close()
              if seed.exists():
                  shutil.rmtree(seed)
              shutil.copytree(data, seed, ignore=shutil.ignore_patterns('monitord.pid', '.monitor.lock'))
          print('seed ready', seed)
          PY
      - name: 24h soak with thresholds
        env:
          SOAK_SECONDS: ${{ github.event.inputs.seconds || '86400' }}
        run: |
          set -euo pipefail
          python3 scripts/soak.py \
            --seconds "${SOAK_SECONDS}" \
            --sample-every 30 \
            --bin core/bin/monitord \
            --seed-data-dir reports/seed-data \
            --seed-config reports/seed-config.yaml \
            --heap-dir reports/soak-heaps \
            --output reports/soak-nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-nightly
          path: |
            reports/soak-nightly.json
            reports/soak-heaps/
          if-no-files-found: warn
