name: Release

# Every push to main whose VERSION file is a stable semver is tagged as v$VERSION
# (no auto patch bump) and packaged into a GitHub Release. Bump VERSION /
# package.json / main.go in source first. Pushing a tag by hand or running the
# workflow manually against an existing tag builds that tag instead. Artifacts
# are unsigned unless the optional signing secrets below are configured:
#   ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish"
        required: true

env:
  FLUTTER_VERSION: "3.35.4"
  GO_VERSION: "1.27.1"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - id: v
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          stable_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version_lt() {
            [[ "$1" != "$2" && "$(printf '%s\n' "$1" "$2" | sort -V | head -1)" == "$1" ]]
          }
          validate_tag() {
            [[ "$1" =~ $stable_tag ]] || { echo "release tag must be stable vMAJOR.MINOR.PATCH: $1" >&2; return 1; }
            # Keep all shipped platform build numbers representable. The Android
            # versionCode ceiling is 2100000000; minor/patch use fixed places.
            local major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            (( ${#major} <= 4 && major <= 2100 && ${#minor} <= 2 && minor < 100 && ${#patch} <= 4 && patch < 10000 )) || { echo "version fields out of range: $1" >&2; return 1; }
            build=$(( major * 1000000 + minor * 10000 + patch ))
            (( build <= 2100000000 )) || { echo "build number out of range: $1" >&2; return 1; }
          }
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"; ref="refs/tags/$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; ref="$GITHUB_REF"
          else
            # Push to main: tag exactly the VERSION file on this commit.
            # No auto patch bump — bump VERSION (and package.json / main.go) in
            # source first, then merge to main to cut a release.
            ref="$GITHUB_SHA"
            source_version=$(git show "$ref:VERSION" 2>/dev/null || true)
            if [[ ! "v$source_version" =~ $stable_tag ]]; then
              echo "VERSION on $ref must be stable MAJOR.MINOR.PATCH, got: $source_version" >&2
              exit 1
            fi
            tag="v$source_version"
            validate_tag "$tag"
            existing=$(git tag --points-at "$GITHUB_SHA" | grep -E "$stable_tag" | sort -V | tail -1 || true)
            if [[ -n "$existing" ]]; then
              if [[ "$existing" != "$tag" ]]; then
                echo "commit already tagged $existing but VERSION is $tag" >&2
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git fetch -q --tags --force origin
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                pointed=$(git rev-list -n1 "$tag")
                if [[ "$pointed" != "$GITHUB_SHA" ]]; then
                  echo "VERSION $source_version already released as $tag on $pointed; skipping package rebuild"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              else
                git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
                git push origin "refs/tags/$tag"
              fi
            fi
          fi
          validate_tag "$tag"
          git rev-parse --verify "$ref^{commit}" >/dev/null
          source_version=$(git show "$ref:VERSION" 2>/dev/null || true)
          version="${tag#v}"
          if [[ "$source_version" != "$version" ]]; then
            echo "VERSION ($source_version) must equal tag $tag (release tags only from VERSION)" >&2
            exit 1
          fi
          # build number set by validate_tag (major*1e6 + minor*1e4 + patch).
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"

  web:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: stamp Dashboard release version
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        working-directory: web
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (file === 'package-lock.json') {
              if (!data.packages?.['']) throw new Error('package-lock.json has no root package');
              data.packages[''].version = version;
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          JS
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist

  # ---------------------------------------------------------------- server ----
  server:
    needs: [meta, web]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64, label: macos-arm64 }
          - { goos: darwin,  goarch: amd64, label: macos-amd64 }
          - { goos: linux,   goarch: amd64, label: linux-amd64 }
          - { goos: linux,   goarch: arm64, label: linux-arm64 }
          - { goos: windows, goarch: amd64, label: windows-amd64 }
          - { goos: freebsd, goarch: amd64, label: freebsd-amd64 }
          - { goos: freebsd, goarch: arm64, label: freebsd-arm64 }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          name="monitord-${tag}-${{ matrix.label }}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name"
          commit=$(git rev-parse HEAD)
          build_time=$(git show -s --format=%cI HEAD | sed 's/+00:00$/Z/; s/\([+-][0-9][0-9]\):\([0-9][0-9]\)$/\1\2/')
          (cd core && go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.releaseBuild=1 -X main.buildTime=$build_time -X main.dirty=false" -o "../dist/$name/monitord$ext" ./cmd/monitord)
          cp monitor.example.yaml README.md "dist/$name/"
          cp docs/22-cloud-host.md "dist/$name/CLOUD-HOST.md"
          cp -r plugins.d "dist/$name/plugins.d"
          if [ "$GOOS" != windows ]; then
            cp packaging/start.sh packaging/stop.sh "dist/$name/"
            chmod 755 "dist/$name/start.sh" "dist/$name/stop.sh"
          fi
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.label }}
          path: dist/*

  server-android:
    needs: [meta, web]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-35 build-tools;35.0.0" }
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - name: build apk
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: ./scripts/build-android-server.sh assembleRelease
      - name: sign (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          in=android/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$in" ] || in=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/ks.jks
            tools="$ANDROID_HOME/build-tools/35.0.0"
            "$tools/zipalign" -f -p 4 "$in" /tmp/aligned.apk
            "$tools/apksigner" sign --ks /tmp/ks.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "dist/monitord-${v}-android-arm64.apk" /tmp/aligned.apk
            rm -f /tmp/ks.jks
          else
            cp "$in" "dist/monitord-${v}-android-arm64-unsigned.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-android
          path: dist/*

  # ---------------------------------------------------------------- client ----
  client-android:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - name: stamp Flutter version
        run: python3 scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --pubspec app/pubspec.yaml
      - run: flutter build apk --release --build-name "${{ needs.meta.outputs.version }}" --build-number "${{ needs.meta.outputs.build_number }}" --dart-define=APP_VERSION=${{ needs.meta.outputs.version }}
        working-directory: app
      - run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/monitor-app-${{ needs.meta.outputs.tag }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: dist/*

  client-linux:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libegl1-mesa-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - name: stamp Flutter version
        run: python3 scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --pubspec app/pubspec.yaml
      - run: flutter build linux --release --build-name "${{ needs.meta.outputs.version }}" --build-number "${{ needs.meta.outputs.build_number }}" --dart-define=APP_VERSION=${{ needs.meta.outputs.version }}
        working-directory: app
      - run: |
          set -euo pipefail
          name="monitor-app-${{ needs.meta.outputs.tag }}-linux-amd64"
          mkdir -p dist
          cp -r app/build/linux/x64/release/bundle "dist/$name"
          python3 scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" \
            --json "dist/$name/data/flutter_assets/version.json"
          cp app/linux/README.md "dist/$name/README.md"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: dist/*

  client-windows:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    # windows-latest ships VS 2026, which Flutter's CMake generator selection
    # does not know yet (falls back to "Visual Studio 16 2019" and fails).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - name: stamp Flutter version
        run: python scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --pubspec app/pubspec.yaml
      - run: flutter build windows --release --build-name "${{ needs.meta.outputs.version }}" --build-number "${{ needs.meta.outputs.build_number }}" --dart-define=APP_VERSION=${{ needs.meta.outputs.version }}
        working-directory: app
      - shell: pwsh
        run: |
          $name = "monitor-app-${{ needs.meta.outputs.tag }}-windows-amd64"
          python scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --json "app/build/windows/x64/runner/Release/data/flutter_assets/version.json"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: dist/*

  client-macos:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - name: stamp Flutter version
        run: python3 scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --pubspec app/pubspec.yaml
      - run: flutter build macos --release --build-name "${{ needs.meta.outputs.version }}" --build-number "${{ needs.meta.outputs.build_number }}" --dart-define=APP_VERSION=${{ needs.meta.outputs.version }}
        working-directory: app
      - name: stamp embedded version.json
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APP_BUILD: ${{ needs.meta.outputs.build_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, "scripts")
          from stamp_app_version import find_macos_version_json_targets
          root = pathlib.Path("app/build/macos/Build/Products/Release")
          try:
              targets = find_macos_version_json_targets(root)
          except FileNotFoundError as e:
              sys.exit(str(e))
          # Require a real flutter_assets dir from the build (do not invent an empty tree).
          real = [t for t in targets if t.parent.is_dir()]
          if not real:
              apps = sorted(root.glob("*.app"))
              sample = []
              if apps:
                  sample = sorted(str(p.relative_to(apps[0])) for p in apps[0].rglob("*") if p.is_file())[:40]
              sys.exit("no flutter_assets under %s; sample=%s" % (root, sample))
          for target in real:
              subprocess.check_call([
                  "python3", "scripts/stamp_app_version.py",
                  os.environ["APP_VERSION"], os.environ["APP_BUILD"],
                  "--json", str(target),
              ])
          print("stamped", len(real), "macos flutter_assets version.json")
          PY
      - name: package arm64 (Apple Silicon) and amd64 (Intel)
        run: ./scripts/package-macos-app.sh app/build/macos/Build/Products/Release/*.app dist "monitor-app-${{ needs.meta.outputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: dist/*

  client-ios:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.ref }}" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - name: stamp Flutter version
        run: python3 scripts/stamp_app_version.py "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.build_number }}" --pubspec app/pubspec.yaml
      - run: flutter build ios --release --no-codesign --build-name "${{ needs.meta.outputs.version }}" --build-number "${{ needs.meta.outputs.build_number }}" --dart-define=APP_VERSION=${{ needs.meta.outputs.version }}
        working-directory: app
      - name: package unsigned ipa
        run: |
          set -euo pipefail
          name="monitor-app-${{ needs.meta.outputs.tag }}-ios-unsigned"
          mkdir -p dist Payload
          cp -r app/build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/$name.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios
          path: dist/*

  # --------------------------------------------------------------- publish ----
  release:
    needs: [meta, server, server-android, client-android, client-linux, client-windows, client-macos, client-ios]
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{server,client}-*"
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Server (`monitord`)
            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `monitord-*-macos-arm64.tar.gz` |
            | macOS Intel | `monitord-*-macos-amd64.tar.gz` |
            | Windows x64 | `monitord-*-windows-amd64.zip` |
            | FreeBSD x64 / arm64 | `monitord-*-freebsd-{amd64,arm64}.tar.gz` |
            | Linux x64 / arm64 | `monitord-*-linux-{amd64,arm64}.tar.gz` |
            | Android (arm64, foreground service) | `monitord-*-android-arm64*.apk` |

            ## Client (`Monitor` app)
            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `monitor-app-*-macos-arm64.dmg` / `.zip` |
            | macOS Intel | `monitor-app-*-macos-amd64.dmg` / `.zip` |
            | Windows x64 | `monitor-app-*-windows-amd64.zip` |
            | Linux x64 | `monitor-app-*-linux-amd64.tar.gz` |
            | Android | `monitor-app-*-android.apk` |
            | iOS (unsigned; sideload with your own signing) | `monitor-app-*-ios-unsigned.ipa` |

            Linux desktop needs GTK 3, `libEGL.so.1`, and libsecret for secure storage:
            `sudo apt install libegl1 libgtk-3-0 libsecret-1-0` (Debian/Ubuntu) or `sudo dnf install mesa-libEGL gtk3 libsecret` (Fedora).

            macOS/iOS/Windows packages are not code-signed or notarized yet; on macOS run
            `xattr -dr com.apple.quarantine <app>` after unpacking. `SHA256SUMS.txt` lists all checksums.
