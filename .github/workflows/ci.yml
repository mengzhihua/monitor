name: CI

on:
  push:
    branches: [main, "codex/reliability-stages-3-5"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist

  core:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
        working-directory: core
      - run: go vet ./...
        working-directory: core
      - run: go test -race ./...
        working-directory: core
      - run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o bin/monitord ./cmd/monitord
        working-directory: core
        shell: bash
      - name: smoke
        run: ./scripts/smoke.sh
        shell: bash

      - name: crash recovery and backup
        if: runner.os != 'Windows'
        run: python3 scripts/verify-durability.py
      - name: Hub capacity and restart
        if: runner.os == 'Linux'
        run: python3 scripts/load-hub.py --output hub-load.json
      - name: Agent soak
        if: runner.os == 'Linux'
        run: python3 scripts/soak.py --seconds 120 --output agent-soak.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: runtime-acceptance
          path: |
            hub-load.json
            agent-soak.json

  browser:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.1", cache-dependency-path: core/go.sum }
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: core/internal/api/ui/dist }
      - run: make core
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-acceptance, path: web/test-results/ }

  cross:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - run: make cross VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: monitord-binaries
          path: core/bin/

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.4", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android-server:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-35 build-tools;35.0.0" }
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - run: ./scripts/build-android-server.sh assembleDebug
        env: { VERSION: "${{ github.sha }}" }
