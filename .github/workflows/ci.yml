name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - name: VERSION must match latest stable git tag
        env: { REQUIRE_GIT_TAG_VERSION: "1" }
        run: python3 scripts/check-release-version.py
      - run: make test-scripts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist

  core:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Go files require formatting:\n%s\n' "$unformatted"
            exit 1
          fi
        working-directory: core
      - run: go vet ./...
        working-directory: core
      - name: Run go test -race ./...
        shell: bash
        run: |
          mkdir -p ../reports
          log="../reports/go-test-${{ runner.os }}.log"
          set +e
          set -o pipefail
          go test -race ./... 2>&1 | tee "$log"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - "$log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import html, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if any(marker in line for marker in ("--- FAIL:", "panic:", "fatal error:", "WARNING: DATA RACE", "[build failed]")):
                  selected.update(range(max(0, i - 3), min(len(lines), i + 32)))
          if not selected:
              selected.update(range(max(0, len(lines) - 100), len(lines)))
          excerpt = "\n".join(lines[i] for i in sorted(selected)[:200])
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Go race test failure\n\nFull output is retained in the core-test-diagnostics artifact.\n\n<pre>" + html.escape(excerpt) + "</pre>\n")
          PY
          fi
          exit "$result"
        working-directory: core
      - name: Retain Go test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-diagnostics-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/go-test-${{ runner.os }}.log
          retention-days: 14
          if-no-files-found: warn
      - name: build monitord
        working-directory: core
        shell: bash
        run: |
          ver=$(tr -d '[:space:]' < ../VERSION)
          short=$(printf '%s' "${{ github.sha }}" | cut -c1-12)
          go build -trimpath -ldflags "-s -w -X main.version=${ver}-dev+${short} -X main.commit=${{ github.sha }} -X main.releaseBuild=0 -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.dirty=false" -o bin/monitord ./cmd/monitord
      - name: smoke
        run: ./scripts/smoke.sh
        shell: bash
      - name: action audit (standalone)
        if: runner.os == 'Linux'
        run: python3 scripts/verify-actions.py
      - name: packaging pidfile decoy guards
        if: runner.os == 'Linux'
        run: python3 scripts/verify-packaging-pidfile.py
      - name: cloud host install script
        if: runner.os == 'Linux'
        run: python3 scripts/verify-cloud-host.py
      - name: cloud host guide links
        if: runner.os == 'Linux'
        run: python3 scripts/verify-cloud-host-doc.py
      - name: zabbix gap matrix evidence
        if: runner.os == 'Linux'
        run: |
          python3 scripts/verify-zabbix-gap.py
          python3 scripts/verify_zabbix_gap_test.py

      - name: crash recovery and backup
        if: runner.os != 'Windows'
        run: python3 scripts/verify-durability.py
      - name: default login protection
        if: runner.os != 'Windows'
        run: python3 scripts/verify-default-auth.py
      - name: local plugin platform lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/verify-plugin-platform.py
      - name: Multi-device protocol fixtures and configuration access
        if: runner.os != 'Windows'
        run: python3 scripts/verify-device-monitoring.py
      - name: SAML IdP stub e2e
        if: runner.os != 'Windows'
        run: python3 scripts/auth-fixtures/verify_saml_e2e.py --bin core/bin/monitord
      - name: personal AI analysis with local provider
        if: runner.os != 'Windows'
        run: python3 scripts/verify-ai-analysis.py
      - name: operations, notifications, maintenance and alert rules
        if: runner.os != 'Windows'
        run: |
          python3 scripts/verify-operations.py
          python3 scripts/verify-notifications.py
          python3 scripts/verify-notification-services.py
          python3 scripts/verify-push-services.py
          python3 scripts/verify-maintenance.py
          python3 scripts/verify-alert-rules.py
      - name: Process identity and snapshot freshness
        if: runner.os == 'macOS'
        run: python3 scripts/verify-apps-identity.py --require-clean-startup
      - name: Hub capacity and restart
        if: runner.os == 'Linux'
        run: |
          mkdir -p reports
          python3 scripts/load-hub.py --output reports/hub-load.json
      - name: Agent soak
        if: runner.os == 'Linux'
        run: python3 scripts/soak.py --seconds 120 --output reports/agent-soak.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: runtime-acceptance
          path: reports/*.json

  browser:
    needs: web
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.1", cache-dependency-path: core/go.sum }
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: core/internal/api/ui/dist }
      - run: make core
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser acceptance (${{ matrix.project }}, no retries)
        run: npm run test:e2e -- --project=${{ matrix.project }} --retries=0
        working-directory: web
      - name: Upload browser report and first-failure traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  cross:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - run: make cross VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: monitord-binaries
          path: core/bin/

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.4", channel: stable, cache: true }
      - run: python3 scripts/stamp_app_version_test.py
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android-server:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-35 build-tools;35.0.0" }
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: core/internal/api/ui/dist
      - run: ./scripts/build-android-server.sh assembleDebug
        env: { VERSION: "${{ github.sha }}" }
