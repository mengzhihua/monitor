name: monitor_app
description: "A new Flutter project."
publish_to: 'none'
# Release CI overwrites this line to match the Git tag (e.g. 0.1.20+10020)
# so data/flutter_assets/version.json is not left at 0.1.0.
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
